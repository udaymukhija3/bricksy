<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14161c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <title>Pack · bricksy</title>
  <link rel="icon" href="../icons/icon-192.png" />
  <meta name="description" content="Turn the piece so it drops into the hole. A daily of eight pieces, or endless with lives." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pack · bricksy" />
  <meta property="og:description" content="Turn the piece so it drops into the hole. A daily of eight pieces, or endless with lives." />
  <meta property="og:image" content="https://udaymukhija3.github.io/bricksy/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
</head>
<body>
  <div id="app" class="layout">
    <header>
      <div class="brand"><a href="../">← bricksy</a> 📦 Pack <span class="sub">mental rotation</span></div>
      <div class="hud" id="hud"></div>
    </header>
    <p id="instructions">Turn the piece so it drops into the hole. Queue turns, then commit — nothing moves until you do. <span id="hint"></span></p>
    <div id="stage">
      <canvas id="c"></canvas>
    </div>
    <div id="panel">
      <div id="queue"></div>
      <div id="moves"></div>
      <div id="actions">
        <button id="undo" title="Backspace">⌫ Undo</button>
        <button id="clear">Clear</button>
        <button id="commit" class="primary" title="Enter">Drop it ↵</button>
      </div>
      <div id="message"></div>
      <div id="post" hidden>
        <button id="retry" title="R">Lift it out, try again</button>
        <button id="replay">Replay my turns slowly</button>
        <button id="skip">Skip this piece</button>
        <button id="next" title="Enter / N">Next piece →</button>
      </div>
    </div>
    <footer>
      <span id="puzzleId" class="mono"></span>
      <span class="keys">keys: <kbd>x</kbd><kbd>y</kbd><kbd>z</kbd> +90°, <kbd>⇧</kbd>+key −90°, <kbd>⌫</kbd> undo, <kbd>↵</kbd> drop</span>
      <a href="../lab.html">lab ↗</a>
      <a href="../match.html">match mode (prototype 0)</a>
      <button id="export">Export log</button>
      <button id="resetProgress">Reset</button>
    </footer>
  </div>
  <script type="module" src="../src/main.ts"></script>
</body>
</html>
